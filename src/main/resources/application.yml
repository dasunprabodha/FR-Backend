spring:
  application:
    name: fr-backend-msc

  # Pulls in ./application-local.yml from the working directory when it exists, so real AWS
  # credentials live in a gitignored file instead of here. "optional:" means the app still starts
  # normally without it (mock services, aws.enabled=false). No profile flag needed - drop the file
  # next to the pom and restart. See application-local.yml.example for the template.
  config:
    import: "optional:file:./application-local.yml"

  servlet:
    multipart:
      # Spring Boot's default is 1MB, which rejected ordinary phone/scanner captures of a NIC
      # before they ever reached the controller. Sized against the downstream limit rather than
      # picked arbitrarily: Rekognition caps inline image bytes at 5MB, and
      # RekognitionImageNormaliser downscales anything above that, so accepting up to 10MB lets a
      # typical 4-8MB phone photo through and be shrunk to fit instead of being refused outright.
      max-file-size: 10MB
      # Covers the whole request: the scannedNIC part plus the JSON "data" part and the multipart
      # framing, so it must sit above max-file-size or a max-size file would still be rejected.
      max-request-size: 12MB

  datasource:
    # File-based (not jdbc:h2:mem:) so registration/approval data survives an app restart - the
    # database lives at ./data/frverify.mv.db. data.sql is written with MERGE INTO (not plain
    # INSERT) specifically so it stays safe to run on every startup against this now-persistent
    # file, instead of only being safe against a throwaway in-memory DB.
    url: jdbc:h2:file:./data/frverify;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: off
    # Let Hibernate create the schema before data.sql tries to insert seed rows into it.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8090
  # Explicit (matches legacy Device_Management's application.yml) so a physical device on the
  # same LAN can reach the /device/ws-endpoint WebSocket - Spring Boot already defaults to
  # binding all interfaces, but this is kept explicit for clarity when testing off-box.
  address: 0.0.0.0

logging:
  level:
    root: INFO
    lk.cf.fr.monolith: DEBUG
    org.springframework.web.socket: INFO

# ---------------------------------------------------------------------------
# Device screen preview (screen casting to the operator console)
# ---------------------------------------------------------------------------
#
# The device mirrors its screen as JPEG frames over the SAME /device/ws-endpoint session it
# already uses for captures; the console watches them over /ws/screen-preview. The device only
# streams while a console is actually watching - see preview/ScreenPreviewService.
#
# fps/max-width/quality are hints passed to the device in start-screen-preview. They are kept
# deliberately modest: a preview only has to be good enough to see which screen the customer is
# on and whether a face is framed, and every frame competes for the same socket the verification's
# capture image has to come back on.
screen-preview:
  enabled: true
  fps: 6
  max-width: 480
  quality: 50
  # Matches the device endpoint's "*". Narrow this to the console's real origin outside local dev.
  allowed-origins: "*"

# ---------------------------------------------------------------------------
# Verification MVP configuration
# ---------------------------------------------------------------------------
verification:
  # Single source of truth for the face-match decision (replaces the legacy's two
  # inconsistent thresholds - Face_Recognition's 80 cutoff AND Api-Gateway's redundant
  # re-check at 70 - see VERIFICATION_PATH_ARCHITECTURE.md section 9/§28 Q5).
  similarity-threshold: 80
  liveness-confidence-threshold: 65

  # --- Identity binding: the OCR'd document number vs. the NIC the applicant claimed -----------
  #
  # Single source of truth. Both the gate (RegistrationAnalysisService) and the evidence panel
  # (DecisionExplanationService) read these, so the panel can never report a threshold the
  # decision did not actually use.
  #
  # binding-gated=false is the FROZEN BASELINE (ablation rung B0): binding is measured, persisted
  # and explained, but excluded from the pass/fail rule. Keep it false until the baseline has been
  # recorded on a labelled corpus - once the live rule includes binding there is nothing left to
  # compare the proposed rule against, and the Evidence Dashboard's rule-comparison panel loses
  # the contrast it exists to show.
  #
  # Set to true for ablation rung B3, or once the baseline is frozen and you want the deployed
  # system to actually catch the mismatched-document attack.
  binding-gated: true

  # When binding IS gated, does missing evidence (no scan uploaded, or OCR read no NIC-shaped
  # number) count as a failure?
  #
  # false mirrors how comparison 4 already behaves - absent evidence is skipped, not failed - so
  # turning binding-gated on does not silently make the scanned document mandatory.
  #
  # true closes the withheld-evidence hole: an attacker cannot evade the number check simply by
  # declining to upload a scan. It also makes the scan effectively required for auto-approval,
  # which is a real product decision, not just a threshold tweak. Measure it both ways.
  binding-required: false

  # Bottom of the positive match band in IdentityBindingService (EXACT 1.00 / CONFUSION 0.85 /
  # FORMAT 0.80), so "bound" means "bound by one of the three positive outcomes".
  binding-threshold: 0.80

  # channel-gated=false is the frozen baseline. Comparison 5 - the uploaded scan against the card
  # physically presented - is the only signal that dissents when an applicant pairs someone else's
  # card with a clean scan of their own. Identity binding cannot see that attack, because the
  # number on the uploaded scan genuinely is theirs: binding reports EXACT_MATCH and the gate
  # approves. Measured on data/corpus-derived (CHANNEL_MISMATCH, n=6) that attack passed the gate
  # 5 times out of 6 with binding already on, and comparison 5 caught 6 of 6 with no false alarm
  # on any bona-fide sample that had a scan to compare (0 of 14).
  #
  # Conditional in the same way comparison 4 is: an absent measurement is excluded, never treated
  # as a failure. With no upload there is no second channel, which is a configuration fact rather
  # than a disagreement.
  #
  # ENABLED after the derived-corpus run. The 14 bona-fide samples behind "no false alarms" are a
  # thin basis - widen it before deployment, especially with poor-quality and photocopied-but-
  # legitimate scans, which are the conditions most likely to make this fire wrongly.
  channel-gated: true


  # --- Proposed rule: margin bands for the three-way decision ----------------------------------
  #
  # Half-width of the band around each threshold inside which a measurement is treated as too close
  # to call, sending the sample to REVIEW instead of forcing it to a side. This is what makes the
  # rule magnitude-aware: the baseline reduces every comparison to a boolean at the cutoff, so a
  # score of 80.1 and one of 99.9 are indistinguishable to it.
  #
  # FIXED BEFORE ANY CORPUS WAS ANALYSED, and deliberately not tuned per dataset. A review band
  # fitted to the data it is then evaluated on measures nothing. If these change, the experiment
  # changes, and the previous results are no longer comparable - so treat an edit here as a
  # protocol amendment and re-run every arm, not as a tweak.
  decision:
    similarity-margin: 5.0
    binding-margin: 0.10
    liveness-margin: 10.0

    # --- Two defect repairs, each runnable as its own labelled ablation rung -------------------
    #
    # These are NOT margin tuning, and the "fixed before any corpus was analysed" rule above does
    # not cover them: neither one moves a threshold, and neither was chosen by looking at where
    # the samples fell. Both default to false so pilot-52-ocrfix stays reproducible byte-for-byte;
    # record each rung separately rather than folding them into one new headline figure.
    #
    # R3. binding-categorical - read the binding OUTCOME instead of banding its score.
    #     IdentityBindingService emits one of six labels with a fixed constant attached
    #     (1.00 / 0.85 / 0.80 for the three documented positive matches). A +/-0.10 band around
    #     the 0.80 cutoff swallows two of those three, so CONFUSION_CORRECTED_MATCH and
    #     FORMAT_EQUIVALENT_MATCH cannot reach SUPPORTS at any threshold - a successful
    #     old-format/new-format reconciliation is reported as "too close to call". A band asks
    #     whether a measurement could have fallen the other way; a categorical verdict could not.
    #     Measured effect on pilot-52-ocrfix: 2 genuine attempts move REVIEW -> APPROVE
    #     (kavinda-G01, kavinda-G02, both FORMAT_EQUIVALENT_MATCH). No attack moves.
    #
    # R4. divergence-inconclusive - DOCUMENT_PORTRAIT abstains instead of contradicting when its
    #     two channels land on opposite sides of the threshold and the better one clears it.
    #     EvidenceGroup takes the minimum as the Frechet lower bound on the conjunction, which
    #     holds only while both members measure the same quantity. Once the presented card and the
    #     uploaded scan disagree, one image is misleading and the minimum assumes it is the honest
    #     one. Consumes the DIVERGENT signal assessCrossChannel already computes and discards; adds
    #     no new threshold and nothing fitted to the data.
    #     Measured effect on pilot-52-ocrfix: 4 genuine attempts move REJECT -> REVIEW
    #     (milan-G01/G02, nipuna-G01/G02). The only 2 DIVERGENT attacks are CLAIM_MISMATCH and stay
    #     REJECT on binding alone. No attack moves.
    #
    # R5. channel-na-without-scan - CHANNEL_AGREEMENT reports NOT_APPLICABLE, not ABSENT, when no
    #     scan was uploaded at all. ABSENT means a measurement that should have been possible was
    #     not; NOT_APPLICABLE means the comparison does not exist in this configuration, which is
    #     already how the liveness group treats an offline replay. cmp5 is null exactly when no
    #     scan was supplied, so a null there is a configuration fact, not a failed measurement.
    #     Without this, every scan-less enrolment is referred to a human on the strength of a
    #     comparison that was never applicable. It does not weaken the withheld-scan defence:
    #     that attack is caught by identity binding, which the OCR fallback supplies precisely
    #     when the scan is missing.
    #     Measured effect on pilot-52-fallback: 6 genuine attempts move REVIEW -> APPROVE.
    #     No attack moves.
    #
    # ENABLED after the pilot-52-fallback run. Recorded ablation, 22 genuine / 30 attack, with the
    # OCR fallback on throughout:
    #     shipped defaults   APCER 0.000  BPCER 0.273  auto-approve 31.8%  review 17.3%
    #     R3                 APCER 0.000  BPCER 0.273  auto-approve 40.9%  review 13.5%
    #     R4                 APCER 0.000  BPCER 0.091  auto-approve 31.8%  review 25.0%
    #     R5                 APCER 0.000  BPCER 0.273  auto-approve 59.1%  review  5.8%
    #     R3+R4+R5           APCER 0.000  BPCER 0.091  auto-approve 68.2%  review  9.6%
    # No rung admits a single attack. The two remaining refusals under R3+R4+R5 are
    # madhuka-G02/G03-UNIID, where the subject presented a university ID instead of a NIC -
    # refusing those is correct, so BPCER against genuine NIC-bearing attempts is 0/20.
    binding-categorical: true
    divergence-inconclusive: true
    channel-na-without-scan: true

  device-image-timeout-seconds: 120
  liveness-wait-timeout-seconds: 60

  # AWS returns a reference image plus `auditImagesLimit` audit images (currently 2, set in
  # RekognitionLivenessService.createSession) inside every GetFaceLivenessSessionResults response.
  # They are not part of any decision - the verdict uses `confidence` alone - so this only controls
  # whether those stills are kept on disk for inspection instead of being discarded. Applies only
  # while aws.enabled=true; the mock liveness service has no images to dump.
  #
  # NOTE: these are face biometrics the system does not otherwise retain anywhere. Set enabled to
  # false to go back to discarding them.
  liveness-image-dump:
    enabled: true
    base-dir: ./data/liveness-images

  # Only used while aws.enabled=false below (the MockFaceRecognitionService / MockLivenessService
  # default values). Can be overridden per-request via the optional mockSimilarity /
  # mockLivenessPassed fields on the request body, for demo purposes.
  mock:
    similarity: 92
    liveness-passed: true
    liveness-score: 90

# ---------------------------------------------------------------------------
# Document OCR source
# ---------------------------------------------------------------------------
document:
  # ocr-fallback-to-capture=false is the frozen baseline: OCR runs only on the officer-uploaded
  # scannedNIC. With no upload there is no number, so identity binding reports UNAVAILABLE and the
  # claimed NIC is never checked against any document - an applicant who simply declines to upload
  # defeats the strongest signal in the system by omission.
  #
  # Set true to read the number off the device-captured nicImage instead when no scan was supplied.
  # The card is cropped first (the same detector the face comparisons use) because OCR on the raw
  # frame reads the room as well as the card.
  #
  # Two things this deliberately does NOT do:
  #   1. It never rejects. A phone photo of a card at arm's length is a harder read than a flatbed
  #      scan, so a fallback UNKNOWN must not end an attempt that would otherwise have passed as
  #      NOT_PROVIDED. The fallback contributes binding evidence only.
  #   2. It does not restore cross-channel independence. With one image the number and the card
  #      come from the same source, so comparison 5 still has nothing to compare against.
  #
  # Every result records which image it came from (NicOcrResult.OcrSource), and results.csv carries
  # it as ocrSource, so scan-derived and capture-derived readings can be reported separately rather
  # than pooled - the fallback's own reliability is a measurement, not an assumption.
  ocr-fallback-to-capture: true

# ---------------------------------------------------------------------------
# Registration MVP configuration - see REGISTRATION_IMPLEMENTATION_PROGRESS.md
# ---------------------------------------------------------------------------
registration:
  device-image-timeout-seconds: 120
  liveness-wait-timeout-seconds: 60
  # Bounded retry count for an invalid/unrecognized NIC document capture (1 = one retry after the
  # first failed attempt), mirroring the legacy's bounded NIC-retry loop - see
  # REGISTRATION_PATH_MONOLITH_ARCHITECTURE.md §3.3/§9.
  nic-max-retries: 1

  mock:
    nic-valid: true
    # No OCR runs in mock mode, so there is no number to extract and identity binding correctly
    # reports UNAVAILABLE. Set this to a NIC number to make the mock claim it read one - the only
    # way to exercise the binding path (match / mismatch / old-new format equivalence) without AWS.
    # e.g. nic-number: "199012345678"
    nic-number: ""

  # Local disk root for images captured during registration, written at capture time for every
  # attempt so a PENDING_APPROVAL record's images survive past the HTTP request (see
  # LocalPendingImageStorageService). Uploaded to S3 only once an auto-pass or a manual approval
  # finalizes the registration.
  pending-images:
    base-dir: ./data/pending-registrations

  # Local disk root for the face-region crops dumped by ComparisonImageDumpService - one
  # source/target crop pair per pairwise comparison (cmp1-cmp4), so a similarity score can be
  # sanity-checked against exactly what Rekognition compared. Diagnostics only, not read back by
  # any other part of the app.
  comparison-dump:
    base-dir: ./data/comparison-analysis

# ---------------------------------------------------------------------------
# Offline evaluation harness (BatchEvaluationService, POST /api/v2/evaluate/batch) - replays
# stored image sets through the real registration analysis pipeline with no device attached.
#
# corpus-root is a security boundary, not just a default: the endpoint takes a caller-supplied
# directory and is currently unauthenticated, so any requested path is resolved inside this root
# and rejected if it escapes it.
#
# ./data/pending-registrations is itself a valid corpus - RegistrationService already writes
# nicImage.jpg / faceImage.jpg / selfImage.jpg per referenceId, which is exactly the layout the
# harness expects, so every registration captured so far can be replayed with no extra setup.
# ---------------------------------------------------------------------------
evaluation:
  corpus-root: ./data
  output-root: ./data/evaluation-runs

# ---------------------------------------------------------------------------
# ID-card region detector (CardDetectorService) - local ONNX/OpenCV model, independent of
# aws.enabled (runs entirely locally, no AWS call). See REGISTRATION_IMPLEMENTATION_PROGRESS.md
# Blocker #1 for why this was originally left out and why it's back.
# ---------------------------------------------------------------------------
fr:
  carddetector:
    path: /models/card_model_2.onnx

  # ---------------------------------------------------------------------------
  # Sinhala / Tamil OCR - the two thirds of a Sri Lankan NIC that Rekognition
  # cannot read.
  #
  # Every field on the card is printed three times: Sinhala, Tamil, English.
  # Rekognition DetectText supports Latin script only, so document classification
  # was deciding "is this a national identity card?" from the English third
  # alone. This second pass runs Tesseract locally (already on the classpath via
  # javacv-platform) over the same cropped card image and reads the other two.
  #
  # OFF BY DEFAULT, deliberately. Turning it on changes document classification,
  # so a run with it on is not comparable to a run with it off. Switch it on for
  # a run, record that you did, and compare the two - do not leave it on and then
  # compare against older results.
  #
  # It can only ever promote a document to VALID, never demote one: it may set
  # the national-identity flag, and is not consulted for the student-ID and
  # driving-licence rejections. A failure, or missing language data, leaves the
  # Rekognition result exactly as it was.
  #
  # Language data is NOT in version control (data/ is gitignored). Fetch it with
  # tools/fetch-tessdata.sh before enabling, or this stays off and says so once
  # in the log.
  #
  # Costs roughly 1.3 s per card on this corpus, entirely local - no AWS call, no
  # data leaving the machine, and nothing that needs re-consenting.
  # ---------------------------------------------------------------------------
  ocr:
    multilingual:
      enabled: false
      tessdata-path: ./data/tessdata
      languages: sin+tam+eng

# ---------------------------------------------------------------------------
# AWS Rekognition / S3 - shared by verification (CompareFaces, Face Liveness) and registration
# (adds DetectText for NIC/document OCR) - only read when aws.enabled=true below.
#
# Paste real values directly below (or leave the ${ENV_VAR:} form to read from an environment
# variable instead - both work). access-key/secret-key can be left blank to fall back to the
# AWS SDK's default credential chain (~/.aws/credentials, instance profile, etc.).
#
# SECURITY NOTE: the legacy Face_Recognition/application.yml had a real AWS access key and
# secret committed to source control in plaintext - do not repeat that here if this project is
# ever pushed to a shared/remote git repository. Prefer environment variables or a
# gitignored application-local.yml for anything beyond local testing.
# ---------------------------------------------------------------------------
aws:
  # Master switch. false = Mock*Service beans (no AWS calls, no credentials needed); true = the
  # real Rekognition/S3 services. Everything below is only read when this is true.
  enabled: true
  region: us-east-1

  # How long a single AWS call may take before it fails instead of blocking the request.
  #
  # The SDK ships with NO api-call timeout at all - only a 30s socket timeout and three retries -
  # so on a poor link one CompareFaces can occupy ~2 minutes. Registration issues five of them
  # sequentially inside one synchronous HTTP request, so without these caps a bad connection
  # presents to the operator as a registration that hangs forever with no error.
  #
  # Generous on purpose: these calls carry image payloads of a few hundred KB. Raise them for a
  # site on a worse connection - the point is that the wait is bounded and reported, not short.
  timeouts:
    attempt-seconds: 25   # one HTTP attempt
    call-seconds: 70      # hard ceiling across all attempts of one logical call
    max-retries: 2

  # ---------------------------------------------------------------------------
  # CREDENTIALS ARE NOT SET HERE.
  #
  # Put them in ./application-local.yml (gitignored, imported automatically at the top of this
  # file). Copy application-local.yml.example to get started. Leaving these blank makes the AWS
  # SDK fall back to its default credential chain (~/.aws/credentials, environment variables,
  # instance profile), which is also fine.
  #
  # This file previously carried a live access key, secret and STS session token in plaintext,
  # and that commit reached the remote. Those credentials must be treated as disclosed and
  # rotated regardless of them having since expired.
  # ---------------------------------------------------------------------------
  access-key: "ASIARQTU3F4GC6NU57LT"
  secret-key: "CBdG9i79i1TAFfgMRnBPMZK7mEm1w3Ds+/1BZGx8"
  session-token: ""

  s3:
    # Bucket containing enrolled reference faces at FaceOnly/<nic>.jpg (see
    # RekognitionFaceRecognitionService / cf-fr-server Face_Recognition S3Service.getImageRef).
    bucket-name: frs3storage
