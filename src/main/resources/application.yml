spring:
  application:
    name: fr-backend-msc

  datasource:
    # File-based (not jdbc:h2:mem:) so registration/approval data survives an app restart - the
    # database lives at ./data/frverify.mv.db. data.sql is written with MERGE INTO (not plain
    # INSERT) specifically so it stays safe to run on every startup against this now-persistent
    # file, instead of only being safe against a throwaway in-memory DB.
    url: jdbc:h2:file:./data/frverify;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: off
    # Let Hibernate create the schema before data.sql tries to insert seed rows into it.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8090
  # Explicit (matches legacy Device_Management's application.yml) so a physical device on the
  # same LAN can reach the /device/ws-endpoint WebSocket - Spring Boot already defaults to
  # binding all interfaces, but this is kept explicit for clarity when testing off-box.
  address: 0.0.0.0

logging:
  level:
    root: INFO
    lk.cf.fr.monolith: DEBUG
    org.springframework.web.socket: INFO

# ---------------------------------------------------------------------------
# Verification MVP configuration
# ---------------------------------------------------------------------------
verification:
  # Single source of truth for the face-match decision (replaces the legacy's two
  # inconsistent thresholds - Face_Recognition's 80 cutoff AND Api-Gateway's redundant
  # re-check at 70 - see VERIFICATION_PATH_ARCHITECTURE.md section 9/§28 Q5).
  similarity-threshold: 80
  liveness-confidence-threshold: 65

  device-image-timeout-seconds: 120
  liveness-wait-timeout-seconds: 60

  # Only used while aws.enabled=false below (the MockFaceRecognitionService / MockLivenessService
  # default values). Can be overridden per-request via the optional mockSimilarity /
  # mockLivenessPassed fields on the request body, for demo purposes.
  mock:
    similarity: 92
    liveness-passed: true
    liveness-score: 90

# ---------------------------------------------------------------------------
# Registration MVP configuration - see REGISTRATION_IMPLEMENTATION_PROGRESS.md
# ---------------------------------------------------------------------------
registration:
  device-image-timeout-seconds: 120
  liveness-wait-timeout-seconds: 60
  # Bounded retry count for an invalid/unrecognized NIC document capture (1 = one retry after the
  # first failed attempt), mirroring the legacy's bounded NIC-retry loop - see
  # REGISTRATION_PATH_MONOLITH_ARCHITECTURE.md §3.3/§9.
  nic-max-retries: 1

  mock:
    nic-valid: true

  # Local disk root for images captured during registration, written at capture time for every
  # attempt so a PENDING_APPROVAL record's images survive past the HTTP request (see
  # LocalPendingImageStorageService). Uploaded to S3 only once an auto-pass or a manual approval
  # finalizes the registration.
  pending-images:
    base-dir: ./data/pending-registrations

  # Local disk root for the face-region crops dumped by ComparisonImageDumpService - one
  # source/target crop pair per pairwise comparison (cmp1-cmp4), so a similarity score can be
  # sanity-checked against exactly what Rekognition compared. Diagnostics only, not read back by
  # any other part of the app.
  comparison-dump:
    base-dir: ./data/comparison-analysis

# ---------------------------------------------------------------------------
# ID-card region detector (CardDetectorService) - local ONNX/OpenCV model, independent of
# aws.enabled (runs entirely locally, no AWS call). See REGISTRATION_IMPLEMENTATION_PROGRESS.md
# Blocker #1 for why this was originally left out and why it's back.
# ---------------------------------------------------------------------------
fr:
  carddetector:
    path: /models/card_model_2.onnx

# ---------------------------------------------------------------------------
# AWS Rekognition / S3 - shared by verification (CompareFaces, Face Liveness) and registration
# (adds DetectText for NIC/document OCR) - only read when aws.enabled=true below.
#
# Paste real values directly below (or leave the ${ENV_VAR:} form to read from an environment
# variable instead - both work). access-key/secret-key can be left blank to fall back to the
# AWS SDK's default credential chain (~/.aws/credentials, instance profile, etc.).
#
# SECURITY NOTE: the legacy Face_Recognition/application.yml had a real AWS access key and
# secret committed to source control in plaintext - do not repeat that here if this project is
# ever pushed to a shared/remote git repository. Prefer environment variables or a
# gitignored application-local.yml for anything beyond local testing.
# ---------------------------------------------------------------------------
aws:
  # Set to true to switch both paths over to the real Rekognition*Service beans (AWS calls)
  # instead of the Mock*Service beans - zero code changes needed, only this flag + the fields
  # below. Leave false until region/bucket-name are filled in, otherwise the AWS SDK clients fail
  # to build at startup.
  enabled: true
  region: us-east-1
  access-key: ASIARQTU3F4GMVOPAJ4X
  secret-key: RkHnGhDOO9C9foWjVvaQc6ICQMTMcbqkf6iB+MmH
  # Only needed for temporary/STS credentials (access key id starts with ASIA) - leave unset
  # for a long-term IAM user access key (starts with AKIA).
  session-token: 
  s3:
    # Bucket containing enrolled reference faces at FaceOnly/<nic>.jpg (see
    # RekognitionFaceRecognitionService / cf-fr-server Face_Recognition S3Service.getImageRef).
    bucket-name: frs3storage

